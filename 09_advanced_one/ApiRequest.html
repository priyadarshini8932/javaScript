<!-- pehle xml http req bejte the api ka use krke -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            background-color: aliceblue;
            height: 250px;
            width: 250px;
            padding:20px;
            text-align: center;
            border-radius: 5px;
        }
        img{
            width:120px;
            border-radius:50%
        }
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
    </style>
 </head>

 <body style="background-color: #212121;">
    <!-- 0	UNSENT	Client has been created. open() not called yet.
1	OPENED	open() has been called.
2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
3	LOADING	Downloading; responseText holds partial data.
4	DONE	The operation is complete. -->
    <button id="getData">GET Data</button>
 </body>
 <script>
    let profileUrl;
    function getData(){
        const requestUrl='https://api.github.com/users/priyadarshini8932';
        const xhr=new XMLHttpRequest(); 
        //open req ko bejta hai
        xhr.open('GET',requestUrl)

        xhr.onreadystatechange=function(){
            // console.log(xhr.readyState); //state changes
            if(xhr.readyState===4){
                const data=JSON.parse(this.responseText); //converts string to JSON
                console.log(typeof data); //response from url comes in form of string
                console.log(data.followers); //current context me this lagaya jata hai
                console.log(data.avatar_url)

                const div=document.createElement('div');
                div.innerHTML=`
                <img src="${data.avatar_url}">
                <h2>Followers:${data.followers}</h2>
                `
                const button =document.getElementById('getData')
                document.body.removeChild(button)
                document.body.appendChild(div)
               
            }
        }
        xhr.send()
    }
    document.getElementById("getData").addEventListener('click',getData)
    console.log(profileUrl)
 </script>
 </html>

 //document and console are not part of core js
 //console.log() browser ka developer tool hai, runtime env me milta of v8(which is written in c++)
 //js chalta hai using runtime env like node js etc
