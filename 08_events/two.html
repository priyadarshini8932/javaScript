<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Chai aur code</h1>
    <button id="stop">Stop</button>
</body>
<script>
    const sayShreya=function(){
        console.log("Shreya")
    }
    const changeText=function(){
        document.querySelector('h1').innerHTML="best JS series"
    }
    
    const changeMe=setTimeout(changeText,2000) //method hai jo api ko bhi call krta hai
    //not part of core js, ye sab browser ke through milte hai
    
    document.querySelector('#stop').addEventListener('click',function(){
        clearTimeout(changeMe)
        console.log("STOPPED")
    })
</script>
</html>
